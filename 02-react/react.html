<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Listado con empleos y filtros para encontrar el trabajo de tus sueños.">

  <title>DevJobs - Empleos</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="module">
    import React from 'https://esm.sh/react?dev';
    import ReactDOM from 'https://esm.sh/react-dom/client?dev';
    window.React = React;
    window.ReactDOM = ReactDOM;

  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">

    function JobCard({ data, titulo, empresa, ubicacion, descripcion }) {


      const [isAplied, setIsAplied] = React.useState(false);
      const handleClick = () => {
        setIsAplied(!isAplied);
      };
      const text = isAplied ? 'Aplicado' : 'Aplicar';

      return (
        <article
          className="job-listing-card"
          data-modalidad={data?.modalidad}
          data-nivel={data?.nivel}
          data-tecnology={data?.tecnology}
        >
          <div>
            <h3>{titulo}</h3>
            <small>{empresa} - {ubicacion}</small>
            <p>{descripcion}</p>
          </div>
          <button
            dissabled={isAplied}
            className={`button-apply-job ${isAplied ? 'is-applied' : ''}`}
            onClick={handleClick}
          >
            {text}
          </button>

        </article>
      );
    }

    function App() {
      return (
        <div>
          <JobCard
            titulo="Desarrollador Frontend"
            empresa="Tech Solutions"
            ubicacion="Madrid, España"
            descripcion="Buscamos un desarrollador frontend con experiencia en React.js para unirse a nuestro equipo dinámico."
            data={{
              modalidad: 'remoto',
              nivel: 'junior',
              tecnology: 'react'
            }}
          />
          <JobCard
            titulo="Ingeniero de Software"
            empresa="Innovatech"
            ubicacion="Barcelona, España"
            descripcion="Estamos buscando un ingeniero de software con habilidades en JavaScript y React para trabajar en proyectos innovadores."
            data={{
              modalidad: 'presencial',
              nivel: 'senior',
              tecnology: 'react'
            }}
          />
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>

</head>

<body>
  <header>
    <h1>
      <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="16 18 22 12 16 6"></polyline>
        <polyline points="8 6 2 12 8 18"></polyline>
      </svg>
      DevJobs
    </h1>

    <nav>
      <!-- <a href="">
        Inicio
      </a> -->
      <a href="">Empleos</a>
    </nav>

    <div>
      <devjobs-avatar service="github" username="midudev" size="40px">

      </devjobs-avatar>
    </div>
  </header>

  <main>
    <section class="jobs-search">
      <h1>React.js Primeros pasos</h1>
    </section>
    <section>
      <h2>Listado de empleos:</h2>
      <div id="root">

      </div>
    </section>
  </main>

  <footer style="padding-bottom: 2000px;">
    <small>&copy; 2025 DevJobs. Todos los derechos reservados.</small>
  </footer>
</body>

</html>
